name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every check runs even after an earlier one fails, so one failing check never hides another.
  # The job still fails when any step fails. Without a synced environment no check runs.
  nightly:
    name: tests, slow, fuzz and large benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - id: sync
        run: uv sync --locked
      - name: tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run nox -s tests
        env:
          HYPOTHESIS_PROFILE: nightly
      - name: slow
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run nox -s slow
        env:
          HYPOTHESIS_PROFILE: nightly
      - name: fuzz
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run nox -s fuzz
      - name: bench
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run nox -s bench -- --tier L

  # Reports the check job's result on main only. A fork's pull_request run cannot reach this
  # job: its github.ref is never refs/heads/main, and its token is read-only.
  report:
    name: report the nightly result
    needs: [nightly]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read # lets the report list the jobs of this run
      issues: write # lets the report open, comment on and close the nightly failure issue
    uses: $/.github/workflows/report-nightly.yml
    with:
      workflow: ${{ github.workflow }}
      result: ${{ needs.nightly.result }}
