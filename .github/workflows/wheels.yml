# Builds one cp313-abi3 wheel per platform target with maturin-action, the dist profile and the
# locked Cargo.lock, plus the sdist. Each wheel is installed with its dependencies and the test
# tools, at the versions uv.lock pins, and runs the ported packages' tests on CPython 3.13 and
# 3.14 from a copy of the suite, so the installed wheel, not the source tree, is imported.
#
# The version job gates every build: on a tag it refuses one that differs from Cargo.toml.
# Each job uploads its wheel before the tests run, so nothing the tests install can replace it.
# Nothing here writes a cache, so a pull request cannot plant build state that a release restores.

name: wheels

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  push:
    tags: ["v*"]

permissions: {}

# A newer run on the same ref cancels an older one, except on a tag: a release build always ends.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  MATURIN_VERSION: "1.16.0"
  UV_VERSION: "0.13.8"
  PYTHONHASHSEED: "0"
  # The dev group's packages that the ported tests import beside the wheel's own dependencies.
  WHEEL_TEST_TOOLS: hypothesis jsonschema pytest rfc8785
  PORTED_TESTS: >-
    tests/unit/core tests/unit/geo tests/unit/time tests/unit/sheet tests/unit/cast
    tests/unit/choreo tests/golden
  WHEEL_CHECK: >-
    import e8s, e8s._core;
    assert "site-packages" in e8s.__file__, e8s.__file__;
    assert "site-packages" in e8s._core.__file__, e8s._core.__file__
  # maturin-action installs the rust-toolchain.toml pin; each build job proves it compiled with it.
  CHECK_PINNED_RUSTC: >-
    pin="$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)";
    rustc --version | grep -q "^rustc $pin " || { echo "E: rustc is not the pinned $pin"; exit 1; }

jobs:
  version:
    name: release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag names the Cargo.toml version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release_version.py "$TAG"

  # The test images are pinned to the digests of their multi-arch indexes; refresh both
  # digests of a variant together. maturin-action picks its own build images by tag.
  linux:
    name: linux ${{ matrix.target }} ${{ matrix.libc }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
            libc: "2_28"
            image: slim
            digest_313: sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
            digest_314: sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
          - runner: ubuntu-24.04-arm
            target: aarch64
            libc: "2_28"
            image: slim
            digest_313: sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
            digest_314: sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
          - runner: ubuntu-24.04
            target: x86_64
            libc: musllinux_1_2
            image: alpine
            digest_313: sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
            digest_314: sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
          - runner: ubuntu-24.04-arm
            target: aarch64
            libc: musllinux_1_2
            image: alpine
            digest_313: sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
            digest_314: sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.libc }}
          args: --profile dist --locked --out dist
          before-script-linux: ${{ env.CHECK_PINNED_RUSTC }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-linux-${{ matrix.target }}-${{ matrix.libc }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Export the locked test constraints
        run: >-
          uv export --locked --format requirements-txt --only-group dev --no-emit-project
          --no-hashes --quiet --output-file constraints.txt
      - name: Copy the test suite away from the e8s source
        run: mkdir suite && cp -R tests pyproject.toml suite/
      - name: Test the wheel on 3.13 and 3.14
        env:
          IMAGE_313: python:3.13-${{ matrix.image }}@${{ matrix.digest_313 }}
          IMAGE_314: python:3.14-${{ matrix.image }}@${{ matrix.digest_314 }}
        run: |
          for image in "$IMAGE_313" "$IMAGE_314"; do
            docker run --rm -v "$PWD:/w" -w /w/suite \
              -e PYTHONHASHSEED -e WHEEL_TEST_TOOLS -e PORTED_TESTS -e WHEEL_CHECK \
              "$image" sh -euc '
                wheel="$(ls /w/dist/*.whl)"
                python -m venv /venv
                /venv/bin/python -m pip install --quiet --constraint /w/constraints.txt \
                  "$wheel[all]" $WHEEL_TEST_TOOLS
                /venv/bin/python -P -c "$WHEEL_CHECK"
                /venv/bin/python -P -m pytest $PORTED_TESTS'
          done

  windows:
    name: windows ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x64
            arch: x64
          - runner: windows-11-arm
            target: aarch64
            arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: python314
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          architecture: ${{ matrix.arch }}
      - id: python313
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: >-
            --profile dist --locked --out dist
            --interpreter ${{ steps.python313.outputs.python-path }}
      - name: Check the build used the pinned toolchain
        run: eval "$CHECK_PINNED_RUSTC"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-windows-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Export the locked test constraints
        run: >-
          uv export --locked --format requirements-txt --only-group dev --no-emit-project
          --no-hashes --quiet --output-file constraints.txt
      - name: Copy the test suite away from the e8s source
        run: mkdir suite && cp -R tests pyproject.toml suite/
      - name: Test the wheel on 3.13 and 3.14
        env:
          PYTHON_313: ${{ steps.python313.outputs.python-path }}
          PYTHON_314: ${{ steps.python314.outputs.python-path }}
        run: |
          wheel="$(ls dist/*.whl)"
          for python in "$PYTHON_313" "$PYTHON_314"; do
            rm -rf venv
            "$python" -m venv venv
            venv/Scripts/python -m pip install --quiet --constraint constraints.txt \
              "$wheel[all]" $WHEEL_TEST_TOOLS
            cd suite
            ../venv/Scripts/python -P -c "$WHEEL_CHECK"
            ../venv/Scripts/python -P -m pytest $PORTED_TESTS
            cd ..
          done

  # The Intel job goes when GitHub retires its macOS Intel runners.
  macos:
    name: macos ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64
          - runner: macos-15-intel
            target: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: python314
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - id: python313
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: >-
            --profile dist --locked --out dist
            --interpreter ${{ steps.python313.outputs.python-path }}
      - name: Check the build used the pinned toolchain
        run: eval "$CHECK_PINNED_RUSTC"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-macos-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Export the locked test constraints
        run: >-
          uv export --locked --format requirements-txt --only-group dev --no-emit-project
          --no-hashes --quiet --output-file constraints.txt
      - name: Copy the test suite away from the e8s source
        run: mkdir suite && cp -R tests pyproject.toml suite/
      - name: Test the wheel on 3.13 and 3.14
        env:
          PYTHON_313: ${{ steps.python313.outputs.python-path }}
          PYTHON_314: ${{ steps.python314.outputs.python-path }}
        run: |
          wheel="$(ls dist/*.whl)"
          for python in "$PYTHON_313" "$PYTHON_314"; do
            rm -rf venv
            "$python" -m venv venv
            venv/bin/python -m pip install --quiet --constraint constraints.txt \
              "$wheel[all]" $WHEEL_TEST_TOOLS
            cd suite
            ../venv/bin/python -P -c "$WHEEL_CHECK"
            ../venv/bin/python -P -m pytest $PORTED_TESTS
            cd ..
          done

  sdist:
    name: sdist
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - name: Check the sdist kept the locked Cargo.lock
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
