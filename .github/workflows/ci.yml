name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # uv builds e8s._core from the Rust crates, so every job that syncs or runs uv first installs
  # the rust-toolchain.toml pin and restores the Rust build cache. Only main saves that cache:
  # target/ holds code that runs, and a pull request must not plant it for main to restore.
  #
  # Answers code=false only for a pull request that changes nothing outside docs/, rust=false
  # only for one that changes no Rust input, and parity=false only for one that changes neither
  # e8s/, a Rust input nor the parity harness. A failure here never skips a heavy job: each one
  # runs unless this job succeeded with code=false (rust=false for the rust job, parity=false
  # for the parity jobs).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
      rust: ${{ steps.classify.outputs.rust }}
      parity: ${{ steps.classify.outputs.parity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_changes.py

  check:
    name: check (${{ matrix.os }}, py${{ matrix.python }})
    needs: changes
    # A matrix job skipped by its own condition reports one unexpanded check name, so the
    # required per-leg checks would wait forever. The legs always start and gate their steps.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python }}
      RUN_CODE_JOBS: >-
        ${{ needs.changes.result != 'success' ||
        needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.13", "3.14"]
    steps:
      - if: env.RUN_CODE_JOBS != 'true'
        run: echo "Skipping code checks, only docs/ changed"
      - if: env.RUN_CODE_JOBS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        if: env.RUN_CODE_JOBS == 'true'
        run: rustup toolchain install
      - if: env.RUN_CODE_JOBS == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: env.RUN_CODE_JOBS == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Check interpreter version
        if: env.RUN_CODE_JOBS == 'true'
        run: uv run --locked python -c "import sys; v='%d.%d'%sys.version_info[:2]; assert v=='${{ matrix.python }}', v; print(v)"
      - if: env.RUN_CODE_JOBS == 'true'
        run: uv run --locked nox -s tests

  lint-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: npm ci
      - run: uv run nox -s lint types api-changes audit

  hashseed:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run nox -s hashseeds

  slow:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv run --locked nox -s slow

  # The large golden's counts, orders and top-N lists must match on every platform, and float
  # noise differs between libm builds and CPUs (arm64 macOS, 2026-11-22: 4921 segments where
  # x86_64 Linux had 4922), so the slow tests run on macOS and Windows too. Like `check`, the
  # legs always start and gate their steps.
  slow-cross:
    name: slow (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"
      RUN_CODE_JOBS: >-
        ${{ needs.changes.result != 'success' ||
        needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - if: env.RUN_CODE_JOBS != 'true'
        run: echo "Skipping code checks, only docs/ changed"
      - if: env.RUN_CODE_JOBS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        if: env.RUN_CODE_JOBS == 'true'
        run: rustup toolchain install
      - if: env.RUN_CODE_JOBS == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: env.RUN_CODE_JOBS == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - if: env.RUN_CODE_JOBS == 'true'
        run: uv run --locked nox -s slow

  lowest:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NOX_UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --resolution lowest-direct
      - run: uv run --no-sync nox -s tests

  wheel:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked nox -s wheel

  core:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked nox -s core

  docker:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose -f docker/docker-compose.yml up --build --exit-code-from e8s

  # The Rust gates, cargo deny and the notice check, on Linux and on arm64 macOS, where the FMA
  # check runs. The cargo tools build in minutes, so .cargo-tools is cached under a key naming
  # the toolchain pin and each tool's pinned version; like the Rust build cache, only main saves
  # it. Like `check`, the legs
  # always start and gate their steps.
  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUN_RUST_JOB: >-
        ${{ needs.changes.result != 'success' ||
        needs.changes.outputs.rust != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - if: env.RUN_RUST_JOB != 'true'
        run: echo "Skipping Rust checks, no Rust input changed"
      - if: env.RUN_RUST_JOB == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        if: env.RUN_RUST_JOB == 'true'
        run: rustup toolchain install
      - if: env.RUN_RUST_JOB == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Read the pinned cargo tool versions
        if: env.RUN_RUST_JOB == 'true'
        id: pins
        run: >-
          echo "versions=$(grep -hE '^(channel|CARGO_(DENY|ABOUT)_VERSION) = '
          rust-toolchain.toml noxfile.py | cut -d '"' -f 2 | paste -s -d '-' -)" >>
          "$GITHUB_OUTPUT"
      - if: env.RUN_RUST_JOB == 'true'
        id: restore-cargo-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.versions }}
      - if: env.RUN_RUST_JOB == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - if: env.RUN_RUST_JOB == 'true'
        run: uv run --locked nox -s rust
      - if: >-
          env.RUN_RUST_JOB == 'true' && github.ref == 'refs/heads/main' &&
          steps.restore-cargo-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo-tools
          key: ${{ steps.restore-cargo-tools.outputs.cache-primary-key }}

  # The working tree against the v0.4.0 oracle on every check cell, under hash seeds 0, 1 and 2.
  # Each leg uploads the SHA-256 digests of its core outputs; parity-compare fails unless all 18
  # are equal. The oracle venv is cached by ref, OS, architecture, full Python version, the lock,
  # its builder and its hashed build requirements; like the Rust build cache, only main saves
  # it. Like `check`, the legs always start and gate their steps.
  parity:
    name: parity (${{ matrix.os }}, py${{ matrix.python }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      UV_PYTHON: ${{ matrix.python }}
      RUN_PARITY_JOB: >-
        ${{ needs.changes.result != 'success' ||
        needs.changes.outputs.parity != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.13", "3.14"]
    steps:
      - if: env.RUN_PARITY_JOB != 'true'
        run: echo "Skipping parity, no library, Rust or harness input changed"
      - if: env.RUN_PARITY_JOB == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        if: env.RUN_PARITY_JOB == 'true'
        run: rustup toolchain install
      - if: env.RUN_PARITY_JOB == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: env.RUN_PARITY_JOB == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Read the full Python version
        if: env.RUN_PARITY_JOB == 'true'
        id: python
        shell: bash
        run: >-
          echo "version=$(uv run --locked python -c
          'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - if: env.RUN_PARITY_JOB == 'true'
        id: restore-oracle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .parity/oracle-v0.4.0
          key: >-
            parity-oracle-v0.4.0-${{ runner.os }}-${{ runner.arch }}-py${{
            steps.python.outputs.version }}-${{ hashFiles('uv.lock', 'scripts/build_oracle.py',
            'scripts/oracle_build.txt') }}
      - name: Compare under hash seeds 0, 1 and 2
        if: env.RUN_PARITY_JOB == 'true'
        shell: bash
        env:
          DIGESTS: parity-digests/${{ runner.os }}-py${{ matrix.python }}
        run: |
          for seed in 0 1 2; do
            PYTHONHASHSEED="$seed" uv run --locked nox -s parity -- all \
              --digest "$DIGESTS-seed$seed.txt"
          done
      - if: env.RUN_PARITY_JOB == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-digests-${{ runner.os }}-py${{ matrix.python }}
          path: parity-digests/
          if-no-files-found: error
      - if: >-
          env.RUN_PARITY_JOB == 'true' && github.ref == 'refs/heads/main' &&
          steps.restore-oracle.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .parity/oracle-v0.4.0
          key: ${{ steps.restore-oracle.outputs.cache-primary-key }}

  # The 18 digests (6 cells, 3 hash seeds) must all arrive. The areas already ported to the core
  # must give byte-identical outputs in all of them; the other areas still run today's Python,
  # whose last bits follow each platform's C math library (2026-11-24, controller ruling on PR
  # #92: Windows and Linux differed on the time clock's val:seconds and val:counts_back), so
  # their differences are printed and never fail the job.
  parity-compare:
    needs: [changes, parity]
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.parity != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: parity-digests-*
          path: parity-digests
          merge-multiple: true
      - name: Compare the parity digests of every cell and seed
        run: python3 scripts/compare_parity_digests.py parity-digests
